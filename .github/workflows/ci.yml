name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobee_ci_user
          POSTGRES_PASSWORD: jobee_ci_password_secure
          POSTGRES_DB: jobee_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://jobee_ci_user:jobee_ci_password_secure@127.0.0.1:5432/jobee_ci_test
      EMAIL_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      API_HOST: 127.0.0.1
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      LOG_LEVEL: error

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify database connectivity
        run: npm run db:check

      - name: Run database migrations
        run: npm run db:migrate

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
