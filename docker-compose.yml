services:
  postgres:
    image: postgres:16-alpine
    container_name: jobee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_job_agent_dev}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobee-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_job_agent_dev}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      EMAIL_TOKEN_ENCRYPTION_KEY: ${EMAIL_TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      INVITE_ONLY_REGISTRATION: ${INVITE_ONLY_REGISTRATION:-true}
    command: ['node', 'apps/api/dist/index.js']

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobee-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_job_agent_dev}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      EMAIL_TOKEN_ENCRYPTION_KEY: ${EMAIL_TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      ORCHESTRATOR_ENABLED: 'true'
      WORKER_POLL_INTERVAL_MS: '5000'
    command: ['node', 'apps/worker/dist/index.js']

volumes:
  pgdata:
